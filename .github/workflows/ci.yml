name: CI

on:
  push:
    branches: [main, visualize-anything-v0.1.0]
  pull_request:
  workflow_dispatch:

jobs:
  python-sdk:
    # Keep a runner with setup-python builds for the supported Python 3.9.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK
        run: python -m pip install -e ./sdk/python
      - name: Run SDK tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v
      - name: Compile example and importer
        run: python -m py_compile examples/vln_demo.py examples/training_demo.py sdk/python/experiment_lens/log_importer.py integrations/claude-code/hook.py integrations/claude-code/install_hooks.py integrations/claude-code/uninstall_hooks.py
      - name: Test Claude Code hook adapter
        run: python -m unittest discover -s integrations/claude-code -p 'test_*.py' -v

  javascript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test JavaScript SDK
        run: node --test sdk/javascript/test/*.test.js
      - name: Test Visualize Anything integration and demos
        run: node --test examples/visualize-anything/integration.test.cjs

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm install
      - name: Check JavaScript syntax
        working-directory: viewer
        run: npm run check
      - name: Test event persistence
        working-directory: viewer
        run: npm test
